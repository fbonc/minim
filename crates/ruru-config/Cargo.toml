[package]
name = "ruru-config"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6"
ruru-provider = { path = "../ruru-provider" }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
