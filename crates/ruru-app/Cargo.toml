[package]
name = "ruru-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ruru"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["tokio"] }
ruru-core = { path = "../ruru-core" }
ruru-types = { path = "../ruru-types" }
ruru-ui = { path = "../ruru-ui" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
ruru-platform = { path = "../ruru-platform" }
