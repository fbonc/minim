[package]
name = "ruru-capture"
version = "0.1.0"
edition = "2024"

[dependencies]
ruru-types = { path = "../ruru-types" }
thiserror = "2.0.20"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3.6.1"
axuielement = "0.9.1"
objc2 = "0.6.4"
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventSource", "CGEventTypes"] }
# Screenshot backend. default-features = false keeps it to the always-on `image`
# dep (png only); its `image` feature would pull in every other codec. `xcap::image`
# is re-exported, so PNG encoding needs no separate image dependency.
xcap = { version = "0.9.8", default-features = false }
tempfile = "3"
# NSWorkspace, to get the frontmost app's pid: the system-wide AX element's
# focused-element read returns kAXErrorCannotComplete on some setups, so reads
# are routed through the frontmost application element (AXUIElementCreateApplication).
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
